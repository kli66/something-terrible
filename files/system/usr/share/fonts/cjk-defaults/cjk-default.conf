<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Language-specific CJK defaults, shared by the host and the Flatpak wrapper.

    `prepend_first` is required, not `prepend`: the host's DMS fontconfig
    (99-dms-theme-sync.conf) strongly prepends "Inter 18pt SemiBold" to the
    generic families. `prepend` inserts before the matched generic value and
    leaves Inter ahead; `prepend_first` inserts at the head of the family list.
    The lang test keeps Latin text on the existing defaults.
  -->

  <!-- Simplified Chinese (zh-CN, zh-SG) -->
  <match target="pattern">
    <test name="lang"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-cn</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-cn</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-sg</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-sg</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-sg</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <!-- Traditional Chinese (zh-TW) -->
  <match target="pattern">
    <test name="lang"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-tw</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-tw</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK TC</string></edit>
  </match>

  <!-- Traditional Chinese, Hong Kong / Macau (zh-HK, zh-MO) -->
  <match target="pattern">
    <test name="lang"><string>zh-hk</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-hk</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-hk</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-mo</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-mo</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-mo</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK HK</string></edit>
  </match>

  <!-- Japanese (ja) -->
  <match target="pattern">
    <test name="lang"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>ja</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>

  <!-- Korean (ko) -->
  <match target="pattern">
    <test name="lang"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>ko</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>ko</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK KR</string></edit>
  </match>
</fontconfig>

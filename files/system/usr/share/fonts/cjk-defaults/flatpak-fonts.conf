<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    FONTCONFIG_FILE for Flatpak apps, seeded by
    flatpak-cjk-fontconfig.service. This file is read inside the sandbox at
    /run/host/fonts/cjk-defaults/flatpak-fonts.conf: Flatpak automatically
    mounts the host's /usr/share/fonts at /run/host/fonts.

    Load the runtime's own config first so its font dirs, caches, and
    50-flatpak.conf are in effect. The explicit host dir covers runtimes whose
    prebuilt cache otherwise skips /run/host/fonts. The shared CJK rules are
    parsed last so their prepend_first edits win.
  -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/run/host/fonts</dir>
  <include ignore_missing="yes">/run/host/fonts/cjk-defaults/cjk-default.conf</include>
</fontconfig>

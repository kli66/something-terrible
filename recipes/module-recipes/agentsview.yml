type: containerfile
snippets:
  # AgentsView 0.45.0. When updating, change this annotation, the pinned digest,
  # and the build-time version assertion together. Resolve the release digest with:
  # skopeo inspect --format '{{.Digest}}' docker://ghcr.io/kenn-io/agentsview:<version>
  - |
    COPY --from=ghcr.io/kenn-io/agentsview@sha256:41789f305701301c6f3b7fa359dc2f095954cc4db65906e0d1c6ad3089cb66bc /usr/local/bin/agentsview /usr/bin/agentsview
    RUN /usr/bin/agentsview --version | grep -F 0.45.0

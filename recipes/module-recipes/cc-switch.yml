modules:
  - type: script
    snippets:
      - |
        set -oue pipefail

        # Install CC Switch (pinned v4.0.9, 2026-10-11)
        # To update: browse https://github.com/farion1231/cc-switch/releases, copy new RPM URL
        CC_SWITCH_URL="https://github.com/farion1231/cc-switch/releases/download/v4.0.9/CC-Switch-v4.0.9-Linux-x86_64.rpm"
        echo "Installing CC Switch from: ${CC_SWITCH_URL}"
        dnf5 install -y "${CC_SWITCH_URL}"

        dnf5 clean all

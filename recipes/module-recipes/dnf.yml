modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:
        - scottames/ghostty
        - avengemedia/dms
    group-install:
      packages:
        - multimedia
        - development-tools
    install:
      packages:
        - neovim
        - emacs-pgtk
        - emacsclient
        - clang-tools-extra
        - ripgrep
        - fd-find
        # Fedora's Nix package enables nix-command and flakes by default. The
        # writable store is bind-mounted from /var/lib/nix at early boot.
        - nix
        - nix-daemon
        - distrobox
        - podman-docker
        - podman-compose
        - fcitx5
        - fcitx5-rime
        - fcitx5-chinese-addons
        - fcitx5-configtool
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-qt6
        - librime-lua
        - wdisplays
        - ghostty
        - kitty
        - niri
        - xwayland-satellite
        - ImageMagick
        - img2pdf
        - xdg-desktop-portal-kde
        - qt6ct
        - adw-gtk3-theme
        - greetd
        - greetd-selinux
        - tuigreet
        # DankMaterialShell (DMS) shell + greeter. Of the packages listed here, only
        # `dms` lives in the avengemedia/dms COPR; the rest (quickshell-git, dms-greeter,
        # danksearch, dankcalendar-git) come from avengemedia/danklinux, enabled
        # transitively as a coprdep of dms.
        # Use quickshell-git, NOT plain quickshell: danklinux publishes both, and they
        # conflict with each other (each declares a Conflicts against the other), so only
        # one can ever be installed. `dms` requires (quickshell or quickshell-git) but is
        # developed against quickshell's git tree, so we track the -git build; pinning
        # plain quickshell would put us on a frozen release that lags what DMS expects.
        # Still NOT noctalia's noctalia-qs fork — noctalia-shell stays out of
        # scripts.yml so nothing pulls noctalia-qs (which also Provides quickshell).
        - dms
        - dms-greeter
        - quickshell-git
        - danksearch
        - dankcalendar-git
        # Btrfs snapshots of /var/home. Config + first-boot subvolume init are
        # shipped via files.yml; timers enabled in systemd.yml.
        # (btrfs-assistant is the GUI front-end.)
        - snapper
        - btrfs-assistant
      exclude:
        - alacritty
        - waybar
        - fuzzel

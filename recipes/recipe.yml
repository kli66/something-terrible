---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: something-terrible
description: This is my personal OS image.

base-image: quay.io/fedora-ostree-desktops/kinoite
# Pinned Fedora release tag, not the floating major: a rebuild uses this base until the tag is
# bumped deliberately. To bump: pick the next 44.<YYYYMMDD>.<n> tag, read its digest with
#   skopeo inspect --format '{{.Digest}}' docker://quay.io/fedora-ostree-desktops/kinoite:<tag>
# update the tag and the digest below, then run tests/check-image-pin.sh.
# Pinned 2026-11-13; digest sha256:47d27b4ae8ae85316a1b8a0f82312153b552cdb21a4fe2f71f9d85e04c8514cf.
image-version: 44.20261112.0

modules:
  - from-file: module-recipes/files.yml
  - from-file: module-recipes/fonts.yml
  - from-file: module-recipes/dnf.yml
  - from-file: module-recipes/terra.yml
  - from-file: module-recipes/brew.yml
  - from-file: module-recipes/kargs.yml
  - from-file: module-recipes/bettbox.yml
  - from-file: module-recipes/bitwarden.yml
  - from-file: module-recipes/cc-switch.yml
  - from-file: module-recipes/chipmunk.yml
  - from-file: module-recipes/grok-bot.yml
  - from-file: module-recipes/proton-pass.yml
  - from-file: module-recipes/agentsview.yml
  - from-file: module-recipes/systemd.yml
  - type: signing
